services:
  - type: web
    name: aequs-edutrack
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aequs-edutrack-db
          property: connectionString

databases:
  - name: aequs-edutrack-db
    plan: free

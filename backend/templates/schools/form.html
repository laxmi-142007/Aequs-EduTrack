<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add School - EduTrack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .topbar {
            background: #172554;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h1 {
            margin: 0;
            font-size: 23px;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #2563eb;
            padding: 9px 15px;
            border-radius: 7px;
        }

        .content {
            padding: 30px;
            max-width: 1000px;
            margin: auto;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #172554;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .button {
            border: none;
            color: white;
            background: #2563eb;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .cancel {
            background: #64748b;
        }

        .cancel:hover {
            background: #475569;
        }

        @media (max-width: 700px) {
            .content {
                padding: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <h1>EduTrack - Add School</h1>

    <a href="{% url 'schools:portal' %}" class="back">
        Back to Portal
    </a>
</header>

<main class="content">

    <div class="form-card">

        <h2>Add New School</h2>

        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="error">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="form-grid">

                {% for field in form %}
                <div class="field {% if field.name == 'address' %}full{% endif %}">

                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}
                        {% for error in field.errors %}
                            <div class="error">{{ error }}</div>
                        {% endfor %}
                    {% endif %}

                </div>
                {% endfor %}

            </div>

            <div class="actions">
                <button type="submit" class="button">
                    Save School
                </button>

                <a href="{% url 'school_list' %}" class="button cancel">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</main>

</body>
</html>

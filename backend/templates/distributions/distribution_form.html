<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Distribution | EduTrack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .back {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            margin: 20px 0 8px;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px #dbeafe;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .save {
            background: #2563eb;
            color: white;
        }

        .save:hover {
            background: #1d4ed8;
        }

        .cancel {
            background: #e5e7eb;
            color: #374151;
        }

        .errorlist {
            color: #dc2626;
            padding-left: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="{% url 'distributions:list' %}" class="back">
        ← Back to Distributions
    </a>

    <h1>Add Distribution</h1>

    <p class="subtitle">
        Record a benefit distributed to a student.
    </p>

    <div class="form-card">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="buttons">

                <button type="submit" class="btn save">
                    Save Distribution
                </button>

                <a href="{% url 'distributions:list' %}"
                   class="btn cancel">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="https://www.aequs.com/wp-content/uploads/2025/06/cropped-Aequs-Lines-01-32x32.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Student Benefit - EduTrack</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", 'Outfit', Arial, sans-serif;
            background: #f4f7fb;
            color: #231f20;
            min-height: 100vh;
        }

        /* =========================
           MAIN WORKSPACE AREA
        ========================= */
        .main {
            margin-left: 256px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: #ffffff;
            padding: 16px 30px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .topbar h1 {
            margin: 0;
            font-size: 20px;
            color: #172554;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content {
            padding: 30px 40px;
            max-width: 800px;
        }

        .back {
            color: #dd2d27;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 15px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14.5px;
        }

        .form-card {
            background: white;
            padding: 30px 35px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
            border: 1px solid #e2e8f0;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14.5px;
            font-family: inherit;
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #dd2d27;
            box-shadow: 0 0 0 3px rgba(221, 45, 39, 0.15);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            border: none;
            padding: 11px 22px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .save {
            background: #dd2d27;
            color: white;
        }

        .save:hover {
            background: #b91c1c;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
        }

        .cancel:hover {
            background: #cbd5e1;
        }

        .errorlist {
            color: #dc2626;
            padding-left: 20px;
            margin-bottom: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Modern Sleek Sidebar -->
    {% include 'includes/sidebar.html' with active_page='distributions' %}

    <!-- =========================================================
         MAIN WORKSPACE AREA
    ========================================================== -->
    <main class="main">
        <header class="topbar">
            <h1>📦 Add New Distribution</h1>
            <a href="{% url 'distributions:list' %}" class="btn cancel btn-sm">← Back to List</a>
        </header>

        <section class="content">
            <a href="{% url 'distributions:list' %}" class="back">
                ← Back to Distributions
            </a>

            <p class="subtitle">
                Record and allocate a benefit or equipment distributed to a student.
            </p>

            <div class="form-card">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="buttons">
                        <button type="submit" class="btn save">
                            💾 Save Distribution
                        </button>
                        <a href="{% url 'distributions:list' %}" class="btn cancel">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const benefitField = document.getElementById("id_benefit_type");
    const studentField = document.getElementById("id_student");
    const academicYearField = document.getElementById("id_academic_year");

    if (!benefitField || !studentField) {
        console.warn("Eligibility dropdown fields were not found.");
        return;
    }

    function loadEligibleStudents() {

        const benefitType = benefitField.value;
        const academicYear = academicYearField
            ? academicYearField.value.trim()
            : "";

        studentField.innerHTML = "";

        const loadingOption = document.createElement("option");
        loadingOption.value = "";
        loadingOption.textContent = benefitType
            ? "Loading eligible students..."
            : "Select Benefit Type first";

        studentField.appendChild(loadingOption);

        if (!benefitType) {
            return;
        }

        let url =
            "{% url 'distributions:api_eligible_students' %}" +
            "?benefit_type=" +
            encodeURIComponent(benefitType);

        if (academicYear) {
            url += "&academic_year=" +
                encodeURIComponent(academicYear);
        }

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                return response.json();
            })
            .then(data => {

                studentField.innerHTML = "";

                const placeholder = document.createElement("option");
                placeholder.value = "";

                if (data.success && data.count > 0) {
                    placeholder.textContent =
                        "Select eligible student";
                } else {
                    placeholder.textContent =
                        "No eligible students found";
                }

                studentField.appendChild(placeholder);

                if (!data.success || !data.students) {
                    return;
                }

                data.students.forEach(student => {

                    const option = document.createElement("option");

                    option.value = student.id;

                    option.textContent =
                        student.name +
                        " (" +
                        student.admission_number +
                        ") - " +
                        student.current_class +
                        " - " +
                        student.school_name;

                    studentField.appendChild(option);
                });
            })
            .catch(error => {

                console.error(
                    "Error loading eligible students:",
                    error
                );

                studentField.innerHTML = "";

                const errorOption = document.createElement("option");
                errorOption.value = "";
                errorOption.textContent =
                    "Unable to load eligible students";

                studentField.appendChild(errorOption);
            });
    }

    // Change Benefit Type ? reload students
    benefitField.addEventListener(
        "change",
        loadEligibleStudents
    );

    // Change Academic Year ? reload students
    if (academicYearField) {
        academicYearField.addEventListener(
            "change",
            loadEligibleStudents
        );
    }

    // Load automatically if Benefit Type is already selected
    if (benefitField.value) {
        loadEligibleStudents();
    }
});
</script>

</body>
</html>

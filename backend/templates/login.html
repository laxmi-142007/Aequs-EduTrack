{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="/static/images/cropped-Aequs-Lines-01-32x32.jpg">
    <link href="/static/css/fonts.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aequs EduTrack Foundation</title>

    <style>
        :root {
            --aequs-red: #dd2d27;
            --aequs-red-dark: #b91c1c;
            --aequs-black: #231f20;
            --bg-light: #f4f7fb;
            --border-color: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--aequs-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(23, 23, 23, 0.62), rgba(221, 45, 39, 0.38)),
                        url("{% static 'images/Aequs-SEZ-Gate.jpg' %}") center/cover no-repeat;
            filter: blur(3px);
            transform: scale(1.04);
            z-index: -1;
        }

        /* Ambient glow spheres for enhanced glass refraction */
        .ambient-glow-1 {
            position: fixed;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(237, 28, 36, 0.32) 0%, rgba(237, 28, 36, 0) 70%);
            top: calc(50% - 190px);
            left: calc(50% - 220px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(25px);
        }

        .ambient-glow-2 {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 70%);
            top: calc(50% + 50px);
            left: calc(50% + 50px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(20px);
        }

        .login-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.10) 100%);
            backdrop-filter: blur(28px) saturate(210%);
            -webkit-backdrop-filter: blur(28px) saturate(210%);
            width: 100%;
            max-width: 420px;
            border-radius: 22px;
            padding: 42px 36px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.50),
                        0 0 0 1px rgba(255, 255, 255, 0.30) inset,
                        0 12px 30px -4px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-top: 1.5px solid rgba(255, 255, 255, 0.75);
            border-left: 1.5px solid rgba(255, 255, 255, 0.75);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.88);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            margin-bottom: 18px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .brand-logo img {
            height: 46px;
            width: auto;
            object-fit: contain;
        }

        .login-card h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35);
        }

        .login-card p.subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.88);
            margin-bottom: 26px;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.38);
            font-size: 13.5px;
            outline: none;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .form-group input:focus {
            background: rgba(255, 255, 255, 0.32);
            border-color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.22), 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ed1c24 0%, #b91c1c 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 6px;
            box-shadow: 0 6px 18px rgba(221, 45, 39, 0.50);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #f02d34 0%, #ba131a 100%);
            box-shadow: 0 8px 24px rgba(221, 45, 39, 0.65);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .error-box {
            background: rgba(185, 28, 28, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fee2e2;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid rgba(254, 202, 202, 0.4);
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .demo-credentials {
            margin-top: 24px;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.95);
            text-align: center;
            line-height: 1.5;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .demo-credentials code {
            background: rgba(255, 255, 255, 0.20);
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="login-card">
        <div class="brand-logo">
            <img src="{% static 'images/Aequs-logo.png' %}" alt="Aequs Foundation" style="height: 52px; width: auto;">
        </div>

        <h2>🔒 Admin Portal Login</h2>
        <p class="subtitle">Enter your credentials to access the EduTrack Dashboard</p>

        {% if error %}
        <div class="error-box">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label for="username">Username / Official Email</label>
                <input type="text" id="username" name="username" required placeholder="e.g. admin" autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Login to Dashboard</button>
        </form>

        <div class="demo-credentials">
            💡 <strong>Default Demo Credentials:</strong><br>
            Username: <code>admin</code> | Password: <code>admin123</code>
        </div>
    </div>

</body>
</html>

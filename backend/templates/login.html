{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="/static/images/cropped-Aequs-Lines-01-32x32.jpg">
    <link href="/static/css/fonts.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aequs EduTrack Foundation</title>

    <style>
        :root {
            --aequs-red: #dd2d27;
            --aequs-red-dark: #b91c1c;
            --aequs-black: #231f20;
            --bg-light: #f4f7fb;
            --border-color: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--aequs-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(23, 23, 23, 0.55), rgba(221, 45, 39, 0.35)),
                        url("{% static 'images/Aequs-SEZ-Gate.jpg' %}") center/cover no-repeat;
            filter: blur(5px);
            transform: scale(1.05);
            z-index: -1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 410px;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .brand-logo img {
            height: 44px;
            width: auto;
            object-fit: contain;
        }

        .login-card h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--aequs-black);
            margin-bottom: 6px;
        }

        .login-card p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 26px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 13.5px;
            outline: none;
            transition: all 0.2s ease;
            background: #ffffff;
        }

        .form-group input:focus {
            border-color: var(--aequs-red);
            box-shadow: 0 0 0 3px rgba(221, 45, 39, 0.14);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--aequs-red);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 6px;
        }

        .btn-submit:hover {
            background: var(--aequs-red-dark);
            transform: translateY(-1px);
        }

        .error-box {
            background: #fef2f2;
            color: #991b1b;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid #fecaca;
            font-size: 12.5px;
            font-weight: 500;
            margin-bottom: 20px;
            text-align: left;
        }

        .demo-credentials {
            margin-top: 24px;
            padding: 12px 14px;
            background: #fff1f1;
            border-radius: 8px;
            border: 1px solid #fecaca;
            font-size: 12px;
            color: #991b1b;
            text-align: center;
            line-height: 1.5;
        }

        .demo-credentials code {
            background: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
            <img src="{% static 'images/Aequs-logo.png' %}" alt="Aequs Foundation" style="height: 52px; width: auto;">
        </div>

        <h2>🔒 Admin Portal Login</h2>
        <p class="subtitle">Enter your credentials to access the EduTrack Dashboard</p>

        {% if error %}
        <div class="error-box">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label for="username">Username / Official Email</label>
                <input type="text" id="username" name="username" required placeholder="e.g. admin" autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Login to Dashboard</button>
        </form>

        <div class="demo-credentials">
            💡 <strong>Default Demo Credentials:</strong><br>
            Username: <code>admin</code> | Password: <code>admin123</code>
        </div>
    </div>

</body>
</html>

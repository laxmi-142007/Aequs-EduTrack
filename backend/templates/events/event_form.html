<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page_title }} | Aequs EduTrack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        .main {
            margin-left: 256px;
            min-height: 100vh;
        }

        .header {
            background: #2563eb;
            color: #ffffff;
            padding: 22px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.20);
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .back-button {
            background: #ffffff;
            color: #2563eb;
            padding: 11px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
        }

        .back-button:hover {
            background: #eff6ff;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
        }

        .card h2 {
            margin-top: 0;
            color: #1e40af;
            font-size: 22px;
        }

        .card-subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #334155;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .save-button {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }

        .save-button:hover {
            background: #1d4ed8;
        }

        .cancel-button {
            background: #e2e8f0;
            color: #334155;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
        }

        .cancel-button:hover {
            background: #cbd5e1;
        }

        @media (max-width: 850px) {
            .main {
                margin-left: 0;
            }
        }

        @media (max-width: 650px) {
            .header {
                padding: 18px 20px;
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .header h1 {
                font-size: 24px;
            }

            .back-button {
                text-align: center;
            }

            .card {
                padding: 20px;
            }

            .actions {
                flex-direction: column;
            }

            .save-button,
            .cancel-button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    {% include 'includes/sidebar.html' with active_page='events' %}

    <div class="main">

        <div class="header">

            <h1>
                &#128197; {{ page_title }}
            </h1>

            <a
                href="{% url 'events:list' %}"
                class="back-button"
            >
                &#8592; Back to Events
            </a>

        </div>

        <div class="container">

            <div class="card">

                <h2>
                    {{ form_title }}
                </h2>

                <p class="card-subtitle">
                    {% if event %}
                        Update the details of this foundation event.
                    {% else %}
                        Add a new foundation event to Aequs EduTrack.
                    {% endif %}
                </p>

                <form method="post">

                    {% csrf_token %}

                    <div class="form-group">

                        <label for="title">
                            Event Title *
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            maxlength="200"
                            value="{{ event.title|default:'' }}"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                        >{{ event.description|default:'' }}</textarea>

                    </div>

                    <div class="form-group">

                        <label for="event_date">
                            Event Date *
                        </label>

                        <input
                            type="date"
                            id="event_date"
                            name="event_date"
                            value="{{ event.event_date|date:'Y-m-d' }}"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            name="location"
                            maxlength="200"
                            value="{{ event.location|default:'' }}"
                        >

                    </div>

                    <div class="form-group">

                        <label for="organizer">
                            Organizer
                        </label>

                        <input
                            type="text"
                            id="organizer"
                            name="organizer"
                            maxlength="150"
                            value="{{ event.organizer|default:'' }}"
                        >

                    </div>

                    <div class="actions">

                        <button
                            type="submit"
                            class="save-button"
                        >
                            {% if event %}
                                Save Changes
                            {% else %}
                                Create Event
                            {% endif %}
                        </button>

                        <a
                            href="{% url 'events:list' %}"
                            class="cancel-button"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
